<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engine OS Remote</title>
<!--
  The board's display, live, with touch. The picture is the MJPEG mirror the
  board serves; a press, drag or release on it is sent to remote-web.py as
  "d x y" / "m x y" / "u" in the board's own pixels, and the touch bridge on
  the board turns that into a finger on a touchscreen Engine believes in.
-->
<style>
  :root { --bg: #0b0b0c; --text: #e6e6e6; --dim: #85858c; --red: #ea2828; --green: #3ddc84; }
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 12px/1.3 -apple-system, "Helvetica Neue", Roboto, sans-serif; height: 100%; }
  body { display: flex; flex-direction: column; }
  header { display: flex; gap: 14px; align-items: baseline; padding: 8px 14px; }
  header h1 { font-size: 14px; font-weight: 600; letter-spacing: .12em; margin: 0; }
  header h1 span { color: var(--red); }
  header .st { color: var(--dim); } header .st b { color: var(--green); } header .st b.off { color: var(--red); }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 14px 14px; min-height: 0; }
  .screen { position: relative; max-width: 100%; max-height: 100%; aspect-ratio: 16 / 9; cursor: crosshair;
    border: 1px solid #2a2a2e; border-radius: 6px; overflow: hidden; background: #000; box-shadow: 0 10px 40px #000; }
  .screen img { display: block; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
  .screen .finger { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%;
    border: 2px solid var(--green); background: rgba(61,220,132,.25); display: none; pointer-events: none; }
  .screen.down .finger { display: block; }
  footer { color: var(--dim); padding: 0 14px 10px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
</style>
</head>
<body>
<header>
  <h1>ENGINE OS <span>ON THE BOARD</span> · remote</h1>
  <div class="st">touch: <b id="conn" class="off">connecting…</b> · <span id="size">—</span> · <span id="last">—</span></div>
</header>
<main>
  <div class="screen" id="screen"><img id="img" alt="the board's display"><div class="finger" id="finger"></div></div>
</main>
<footer>press = finger down · drag = move · release = up · the stream is the board's HDMI output, a few frames a second</footer>
<script>
'use strict';
const screen_ = document.getElementById('screen'), img = document.getElementById('img'), finger = document.getElementById('finger');
let W = 1920, H = 1080, down = false, last = 0, queue = [], flushing = false;

fetch('/config').then(r => r.json()).then(c => {
  W = c.width; H = c.height; img.src = c.mirror;
  screen_.style.aspectRatio = W + ' / ' + H;
  document.getElementById('size').textContent = W + '×' + H;
  setConn(c.connected, c.error);
});
function setConn(ok, err) { const e = document.getElementById('conn'); e.textContent = ok ? 'connected' : 'offline' + (err ? ' · ' + err : ''); e.className = ok ? '' : 'off'; }

// the picture is letterboxed inside the box: map a pointer to the board's pixels
function toBoard(ev) {
  const r = screen_.getBoundingClientRect();
  const scale = Math.min(r.width / W, r.height / H), pw = W * scale, ph = H * scale;
  const ox = (r.width - pw) / 2, oy = (r.height - ph) / 2;
  const x = Math.round((ev.clientX - r.left - ox) / scale), y = Math.round((ev.clientY - r.top - oy) / scale);
  finger.style.left = (ev.clientX - r.left) + 'px'; finger.style.top = (ev.clientY - r.top) + 'px';
  return [Math.max(0, Math.min(W - 1, x)), Math.max(0, Math.min(H - 1, y))];
}
function send(line) {
  queue.push(line); document.getElementById('last').textContent = line;
  if (!flushing) flush();
}
async function flush() {
  flushing = true;
  while (queue.length) {
    const body = queue.splice(0).join('\n');
    try { const r = await fetch('/touch', { method: 'POST', body, keepalive: true }); setConn(r.ok, r.ok ? '' : await r.text()); }
    catch (e) { setConn(false, e.message); }
  }
  flushing = false;
}
screen_.addEventListener('pointerdown', ev => { ev.preventDefault(); down = true; screen_.classList.add('down');
  screen_.setPointerCapture(ev.pointerId); const [x, y] = toBoard(ev); send(`d ${x} ${y}`); });
screen_.addEventListener('pointermove', ev => { if (!down) return; const now = performance.now();
  if (now - last < 30) return; last = now; const [x, y] = toBoard(ev); send(`m ${x} ${y}`); });
const up = ev => { if (!down) return; down = false; screen_.classList.remove('down'); send('u'); };
screen_.addEventListener('pointerup', up); screen_.addEventListener('pointercancel', up);
// the stream drops when ffmpeg restarts: reload the picture
img.addEventListener('error', () => setTimeout(() => { img.src = img.src.split('?')[0] + '?' + Date.now(); }, 1500));
</script>
</body>
</html>

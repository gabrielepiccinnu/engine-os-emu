<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mixstream Pro Surface</title>
<!--
  The Numark Mixstream Pro control surface as a web page. Every control sends
  exactly what the real surface's microcontroller sends, as read from the
  product's own assignment file in the rootfs:
  /usr/Engine/AssignmentFiles/PresetAssignmentFiles/NH08/NH08_Controller_Assignments.qml

  Channels are zero based, as that file writes them:
    15      global: LOAD 1/2 = notes 1/2, BACK 3, browse CC 5 / push 6, MENU 7,
            VIEW 16, SoundSwitch 34; crossfader CC 14, master 15, cue mix 9,
            cue gain 10, speaker 17; VU meters back from Engine on CC 32/33
    2 / 3   deck left / right: SYNC 8, CUE 9, PLAY 10, pad modes 11 12 14 13,
            pads 15..18, SHIFT 28, pitch bend 29/30, jog touch 33, jog 14-bit
            CC 0x37/0x4D, VINYL 35, speed slider 14-bit CC 0x1F/0x4B
    0 / 1   mixer channel 1 / 2: TRIM 3, HI 4, MID 6, LOW 8, SWEEP FX 11,
            PFL 13, fader 14
    4       FX: select Echo/Flanger/Delay/Phaser = notes 0..3, paddle note 4
            (channel 5 for the right paddle)

  Bytes go to surface-web.py as hex over POST /midi and from there down one ssh
  pipe into the guest's inject device. What Engine sends back to the surface,
  LED notes and VU meter CCs, arrives on /events and lights the same controls.
-->
<style>
  :root {
    --bg: #0b0b0c; --panel: #151517; --panel2: #1e1e21; --line: #2a2a2e;
    --text: #e6e6e6; --dim: #85858c; --red: #ea2828; --red2: #ff5a5a;
    --green: #3ddc84; --blue: #4a8cf7; --amber: #ffb340; --cyan: #2fb0ff;
  }
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 12px/1.3 -apple-system, "Helvetica Neue", Roboto, sans-serif; }
  body { padding: 10px 14px 52px; }
  header { display: flex; align-items: baseline; gap: 14px; margin: 0 0 10px 4px; flex-wrap: wrap; }
  header h1 { font-size: 15px; font-weight: 600; letter-spacing: .12em; margin: 0; }
  header h1 span { color: var(--red); }
  header .st { color: var(--dim); }
  header .st b { color: var(--green); font-weight: 600; }
  header .st b.off { color: var(--red2); }

  .surface { display: grid; grid-template-columns: minmax(300px, 1fr) 360px minmax(300px, 1fr); gap: 12px; align-items: start; }
  @media (max-width: 1000px) { .surface { grid-template-columns: 1fr; } }
  .deck, .mixer { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }

  /* the deck: explicit areas, so nothing can wander into the narrow column */
  .deck { display: grid; gap: 10px; grid-template-columns: 1fr 60px;
    grid-template-areas: "top top" "jog side" "pads pads" "transport transport"; }
  .deck.right { grid-template-columns: 60px 1fr; grid-template-areas: "top top" "side jog" "pads pads" "transport transport"; }
  .deck .top { grid-area: top; display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .deck .top .btn { flex: 0 0 auto; min-width: 84px; }
  .deck .name { color: var(--dim); letter-spacing: .2em; font-size: 11px; flex: 1; }
  .deck.right .name { text-align: right; order: 3; }
  .deck .jogwrap { grid-area: jog; display: flex; align-items: center; justify-content: center; }
  .deck .side { grid-area: side; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .deck .pads { grid-area: pads; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .deck .transport { grid-area: transport; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }

  .btn { background: var(--panel2); border: 1px solid #333; border-radius: 8px; color: var(--text);
    padding: 8px 6px; text-align: center; font-size: 11px; font-weight: 600; letter-spacing: .06em;
    cursor: pointer; position: relative; min-height: 38px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; --accent: #bbb; transition: box-shadow .08s, background .08s; }
  .btn small { display: block; color: var(--dim); font-weight: 400; font-size: 9px; letter-spacing: 0; margin-top: 2px; }
  .btn.down { transform: translateY(1px); border-color: #666; background: #2b2b30; }
  /* lit = what Engine says; down = what the finger does */
  .btn.lit { background: var(--accent); color: #111; border-color: transparent; box-shadow: 0 0 14px var(--accent); }
  .btn.lit small { color: rgba(0,0,0,.55); }
  .btn.lit.dimmed { background: color-mix(in srgb, var(--accent) 35%, #1e1e21); color: #ddd; box-shadow: none; }
  .btn.red   { --accent: var(--red2); }
  .btn.green { --accent: var(--green); }
  .btn.amber { --accent: var(--amber); }
  .btn.blue  { --accent: var(--blue); }
  .btn.cyan  { --accent: var(--cyan); }
  .btn.big { min-height: 54px; font-size: 12px; }
  .btn.pad { min-height: 58px; border-radius: 6px; background: #1b1b1f; --accent: var(--cyan); }
  .btn.mode { min-height: 28px; padding: 5px; font-size: 10px; }
  .btn.sq { width: 60px; min-height: 34px; padding: 4px; }

  .jog { width: min(100%, 280px); aspect-ratio: 1; border-radius: 50%; position: relative; cursor: grab;
    background: radial-gradient(circle at 50% 50%, #26262a 0 36%, #0e0e10 37% 39%, #1b1b1e 40% 93%, #0a0a0b 94%);
    border: 1px solid #333; box-shadow: inset 0 0 40px #000, 0 6px 20px #000; }
  .jog.touched { box-shadow: inset 0 0 40px #000, 0 0 0 3px var(--red); }
  .jog .mark { position: absolute; left: 50%; top: 7%; width: 3px; height: 13%; margin-left: -1.5px;
    background: var(--red); border-radius: 2px; transform-origin: 50% 330%; }
  .jog .label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; color: var(--dim); font-size: 10px; letter-spacing: .1em; pointer-events: none; }
  .jog .label b { color: var(--text); font-size: 13px; }

  .vfader { width: 44px; height: 200px; background: var(--panel2); border: 1px solid #333; border-radius: 6px;
    position: relative; cursor: ns-resize; }
  .vfader.short { height: 150px; } .vfader.mixer { height: 130px; width: 40px; }
  .vfader .track { position: absolute; left: 50%; top: 10px; bottom: 10px; width: 3px; margin-left: -1.5px; background: #000; }
  .vfader .cap { position: absolute; left: 4px; right: 4px; height: 20px; margin-top: -10px; background: #3a3a40;
    border: 1px solid #666; border-radius: 3px; box-shadow: 0 2px 6px #000; }
  .vfader .cap::after { content: ""; position: absolute; left: 6px; right: 6px; top: 50%; height: 2px; background: #ddd; }
  .vfader .centre { position: absolute; left: 6px; right: 6px; top: 50%; height: 1px; background: #444; }
  .hfader { height: 40px; width: 100%; background: var(--panel2); border: 1px solid #333; border-radius: 6px; position: relative; cursor: ew-resize; }
  .hfader .track { position: absolute; top: 50%; left: 10px; right: 10px; height: 3px; margin-top: -1.5px; background: #000; }
  .hfader .cap { position: absolute; top: 4px; bottom: 4px; width: 26px; margin-left: -13px; background: #3a3a40; border: 1px solid #666; border-radius: 3px; }
  .hfader .cap::after { content: ""; position: absolute; top: 6px; bottom: 6px; left: 50%; width: 2px; background: #ddd; }
  .lab { color: var(--dim); font-size: 9px; letter-spacing: .12em; text-align: center; text-transform: uppercase; }

  .kw { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .kw .val { color: var(--dim); font-size: 9px; font-variant-numeric: tabular-nums; }
  .knob { width: 38px; height: 38px; border-radius: 50%; position: relative; cursor: ns-resize;
    background: radial-gradient(circle at 50% 40%, #3a3a40, #17171a 70%); border: 1px solid #444; box-shadow: 0 3px 8px #000; }
  .knob .ptr { position: absolute; left: 50%; top: 3px; width: 3px; height: 12px; margin-left: -1.5px; background: #fff; border-radius: 2px; transform-origin: 50% 16px; }

  .mixer { display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; }
  .row.center { justify-content: center; align-items: center; }
  .col { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .strip { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;
    background: #111113; border: 1px solid var(--line); border-radius: 8px; padding: 8px 6px; }
  .strip .ch { color: var(--dim); font-size: 10px; letter-spacing: .2em; }
  .strip .knobs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; justify-items: center; }
  .strip .knobs .btn { align-self: center; width: 100%; }
  .mid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; padding-top: 22px; }
  .strip .bottom { display: flex; gap: 6px; align-items: flex-end; }
  .vu { width: 10px; height: 130px; background: #0a0a0a; border: 1px solid #333; border-radius: 3px; display: flex; flex-direction: column-reverse; gap: 2px; padding: 3px 2px; }
  .vu i { display: block; flex: 1; background: #1c1c1f; border-radius: 1px; }
  .vu i.on { background: var(--green); box-shadow: 0 0 5px var(--green); }
  .vu i:nth-child(5).on { background: var(--amber); box-shadow: 0 0 5px var(--amber); }
  .vu i:nth-child(6).on { background: var(--red2); box-shadow: 0 0 5px var(--red2); }
  .encoder { width: 78px; height: 78px; border-radius: 50%; cursor: pointer; position: relative;
    background: radial-gradient(circle at 50% 40%, #333, #141416 75%); border: 1px solid #555; box-shadow: 0 4px 12px #000; }
  .encoder.down { border-color: var(--red); }
  .encoder .ptr { position: absolute; left: 50%; top: 6px; width: 4px; height: 14px; margin-left: -2px; background: #fff; border-radius: 2px; transform-origin: 50% 33px; }
  .encoder .hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--dim); font-size: 9px; text-align: center; pointer-events: none; line-height: 1.25; }
  .fx { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .paddles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .sep { height: 1px; background: var(--line); }

  /* the board's display, when the server is pointed at the board */
  .screenwrap { display: none; margin: 0 0 12px; }
  .screenwrap.on { display: flex; justify-content: center; }
  .screen { position: relative; width: min(100%, 960px); aspect-ratio: 16 / 9; cursor: crosshair; background: #000;
    border: 1px solid #2a2a2e; border-radius: 8px; overflow: hidden; box-shadow: 0 10px 40px #000; }
  .screen img { display: block; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
  .screen .finger { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%;
    border: 2px solid var(--green); background: rgba(61,220,132,.25); display: none; pointer-events: none; }
  .screen.down .finger { display: block; }
  footer { position: fixed; left: 0; right: 0; bottom: 0; background: #0f0f10; border-top: 1px solid var(--line);
    padding: 6px 14px; display: flex; gap: 16px; align-items: center; font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--dim); }
  footer .log { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #bbb; }
  footer .in { color: var(--green); }
  kbd { background: #222; border: 1px solid #444; border-radius: 3px; padding: 0 4px; color: #ccc; }
</style>
</head>
<body>
<header>
  <h1>NUMARK <span>MIXSTREAM PRO</span> · virtual surface</h1>
  <div class="st">bridge: <b id="conn" class="off">connecting…</b> · out <span id="sent">0</span> B · LEDs: <b id="evconn" class="off">—</b></div>
</header>

<div class="screenwrap" id="screenwrap">
  <div class="screen" id="screen"><img id="screenimg" alt=""><div class="finger" id="finger"></div></div>
</div>

<div class="surface">
  <section class="deck left" id="deckL"></section>
  <section class="mixer" id="mixer"></section>
  <section class="deck right" id="deckR"></section>
</div>

<footer>
  <span>out:</span><span class="log" id="log">—</span>
  <span>in:</span><span class="log in" id="login">—</span>
  <span><kbd>shift</kbd> SHIFT · <kbd>space</kbd> play 1 · <kbd>↵</kbd> load 1 · <kbd>↑↓</kbd> browse · dbl-click knob = centre</span>
</footer>

<script>
'use strict';
// ---------------------------------------------------------------- out: the surface -> Engine
const hex = n => n.toString(16).padStart(2, '0');
let queue = [], flushing = false, sentBytes = 0;
function midi(...bytes) {
  queue.push(bytes.map(hex).join(''));
  document.getElementById('log').textContent = bytes.map(b => hex(b).toUpperCase()).join(' ');
  if (!flushing) flush();
}
async function flush() {
  flushing = true;
  while (queue.length) {
    const body = queue.splice(0).join('');           // coalesce whatever piled up
    try {
      const r = await fetch('/midi', { method: 'POST', body, keepalive: true });
      if (r.ok) { sentBytes += body.length / 2; setConn(true); } else setConn(false, await r.text());
    } catch (e) { setConn(false, e.message); }
  }
  flushing = false;
}
function setConn(ok, err) {
  const el = document.getElementById('conn');
  el.textContent = ok ? 'connected' : ('offline' + (err ? ' · ' + err : ''));
  el.className = ok ? '' : 'off';
  document.getElementById('sent').textContent = sentBytes;
}
setInterval(async () => {
  try { const s = await (await fetch('/status')).json(); setConn(s.connected, s.error); }
  catch (e) { setConn(false, 'server gone'); }
}, 3000);

const noteOn  = (ch, n, v = 127) => midi(0x90 | ch, n, v);
const noteOff = (ch, n)          => midi(0x80 | ch, n, 0);
const cc      = (ch, c, v)       => midi(0xB0 | ch, c, Math.max(0, Math.min(127, v | 0)));
const cc14    = (ch, msb, lsb, v) => { v = Math.max(0, Math.min(16383, v | 0)); cc(ch, msb, v >> 7); cc(ch, lsb, v & 127); };

// ---------------------------------------------------------------- in: Engine -> the surface (LEDs, VU)
const leds = {};                                     // "n:ch:note" -> [elements], "c:ch:cc" -> [fn]
function onLed(key, el) { (leds[key] = leds[key] || []).push(el); }
function applyLed(key, v) {
  for (const t of leds[key] || []) {
    if (typeof t === 'function') { t(v); continue; }
    t.classList.toggle('lit', v > 0);
    t.classList.toggle('dimmed', v > 0 && v < 32);   // a dim colour is Engine's "available but off"
    t.title = key + ' = ' + v;
  }
}
function listen() {
  const es = new EventSource('/events');
  const ind = document.getElementById('evconn');
  es.addEventListener('state', e => { const st = JSON.parse(e.data); for (const k in st) applyLed(k, st[k]);
    ind.textContent = 'live'; ind.className = ''; });
  es.onmessage = e => { const m = JSON.parse(e.data); applyLed(m.k, m.v);
    document.getElementById('login').textContent = m.k + ' = ' + m.v; };
  es.onerror = () => { ind.textContent = 'reconnecting'; ind.className = 'off'; };
}
listen();

// ---------------------------------------------------------------- the board's display, with touch
// Present only when the server runs with BOARD=1: /config answers, the MJPEG
// comes from /stream, and a press, drag or release on the picture goes to
// /touch in the board's own pixels, where the touch bridge makes it a finger.
(async () => {
  let c; try { c = await (await fetch('/config')).json(); } catch (e) { return; }
  if (!c || !c.width) return;
  const wrap = document.getElementById('screenwrap'), sc = document.getElementById('screen');
  const img = document.getElementById('screenimg'), finger = document.getElementById('finger');
  const W = c.width, H = c.height; let down = false, last = 0, q = [], busy = false;
  sc.style.aspectRatio = W + ' / ' + H; img.src = c.mirror; wrap.classList.add('on');
  const toBoard = ev => { const r = sc.getBoundingClientRect(); const k = Math.min(r.width / W, r.height / H);
    const ox = (r.width - W * k) / 2, oy = (r.height - H * k) / 2;
    finger.style.left = (ev.clientX - r.left) + 'px'; finger.style.top = (ev.clientY - r.top) + 'px';
    return [Math.max(0, Math.min(W - 1, Math.round((ev.clientX - r.left - ox) / k))), Math.max(0, Math.min(H - 1, Math.round((ev.clientY - r.top - oy) / k)))]; };
  const send = line => { q.push(line); if (!busy) flushT(); };
  async function flushT() { busy = true; while (q.length) { const body = q.splice(0).join('\n');
    try { await fetch('/touch', { method: 'POST', body, keepalive: true }); } catch (e) {} } busy = false; }
  sc.addEventListener('pointerdown', ev => { ev.preventDefault(); down = true; sc.classList.add('down'); sc.setPointerCapture(ev.pointerId); const [x, y] = toBoard(ev); send(`d ${x} ${y}`); });
  sc.addEventListener('pointermove', ev => { if (!down) return; const now = performance.now(); if (now - last < 30) return; last = now; const [x, y] = toBoard(ev); send(`m ${x} ${y}`); });
  const up = () => { if (!down) return; down = false; sc.classList.remove('down'); send('u'); };
  sc.addEventListener('pointerup', up); sc.addEventListener('pointercancel', up);
  img.addEventListener('error', () => setTimeout(() => { img.src = c.mirror.split('?')[0] + '?' + Date.now(); }, 1500));
})();

// ---------------------------------------------------------------- the map (NH08_Controller_Assignments.qml)
const G = 15;
const DECK = { L: { ch: 2, load: 1, name: 'DECK 1' }, R: { ch: 3, load: 2, name: 'DECK 2' } };
const MIX  = { L: 0, R: 1 };
const N = { back: 3, push: 6, menu: 7, view: 16, soundswitch: 34,
            sync: 8, cue: 9, play: 10, modes: [11, 12, 14, 13], pad0: 15, shift: 28,
            bendMinus: 29, bendPlus: 30, jogTouch: 33, vinyl: 35, pfl: 13 };
const C = { browse: 5, xfader: 14, master: 15, cueMix: 9, cueGain: 10, speaker: 17,
            trim: 3, hi: 4, mid: 6, low: 8, sweep: 11, fader: 14, vu: [32, 33],
            jogMsb: 0x37, jogLsb: 0x4D, speedMsb: 0x1F, speedLsb: 0x4B };
const FX = { ch: 4, select: ['ECHO', 'FLANGER', 'DELAY', 'PHASER'], paddle: 4, paddleR: 5 };

// ---------------------------------------------------------------- widgets
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

function button(label, ch, note, cls = '', sub = '') {
  const b = el('div', 'btn ' + cls, label + (sub ? `<small>${sub}</small>` : ''));
  b.addEventListener('pointerdown', e => { e.preventDefault(); b.classList.add('down'); noteOn(ch, note); b.setPointerCapture(e.pointerId); });
  const up = () => { if (b.classList.contains('down')) { b.classList.remove('down'); noteOff(ch, note); } };
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);
  onLed(`n:${ch}:${note}`, b);                       // Engine lights it on the same channel and note
  return b;
}

function knob(label, ch, ccNum, { centre = false, init } = {}) {
  const w = el('div', 'kw'); const k = el('div', 'knob', '<div class="ptr"></div>');
  const val = el('div', 'val'); w.append(k, el('div', 'lab', label), val);
  let v = init != null ? init : (centre ? 64 : 0), y0 = null, v0;
  const show = () => { k.querySelector('.ptr').style.transform = `rotate(${(v / 127) * 270 - 135}deg)`; val.textContent = v; };
  const set = nv => { nv = Math.max(0, Math.min(127, Math.round(nv))); if (nv !== v) { v = nv; show(); cc(ch, ccNum, v); } };
  k.addEventListener('pointerdown', e => { e.preventDefault(); y0 = e.clientY; v0 = v; k.setPointerCapture(e.pointerId); });
  k.addEventListener('pointermove', e => { if (y0 != null) set(v0 + (y0 - e.clientY) * (e.shiftKey ? 0.2 : 0.8)); });
  const end = () => { y0 = null; };
  k.addEventListener('pointerup', end); k.addEventListener('pointercancel', end);
  k.addEventListener('dblclick', () => set(centre ? 64 : 0));
  k.addEventListener('wheel', e => { e.preventDefault(); set(v - Math.sign(e.deltaY) * (e.shiftKey ? 1 : 3)); }, { passive: false });
  show();
  return w;
}

// vertical fader: 7-bit, or 14-bit when lsb is given
function vfader(label, ch, msb, lsb, { centre = false, init, cls = '' } = {}) {
  const w = el('div', 'col'); const f = el('div', 'vfader ' + cls);
  f.innerHTML = '<div class="track"></div>' + (centre ? '<div class="centre"></div>' : '') + '<div class="cap"></div>';
  const max = lsb != null ? 16383 : 127;
  let v = init != null ? init : (centre ? max >> 1 : 0);
  const cap = f.querySelector('.cap');
  const show = () => { const h = f.clientHeight - 20; cap.style.top = (10 + h * (1 - v / max)) + 'px'; };
  const set = nv => { nv = Math.max(0, Math.min(max, Math.round(nv))); if (nv !== v) { v = nv; show(); lsb != null ? cc14(ch, msb, lsb, v) : cc(ch, msb, v); } };
  const fromY = y => { const r = f.getBoundingClientRect(); return max * (1 - (y - r.top - 10) / (r.height - 20)); };
  let dragging = false;
  f.addEventListener('pointerdown', e => { e.preventDefault(); dragging = true; f.setPointerCapture(e.pointerId); set(fromY(e.clientY)); });
  f.addEventListener('pointermove', e => { if (dragging) set(fromY(e.clientY)); });
  const end = () => { dragging = false; };
  f.addEventListener('pointerup', end); f.addEventListener('pointercancel', end);
  f.addEventListener('dblclick', () => set(centre ? max >> 1 : 0));
  w.append(f, el('div', 'lab', label));
  requestAnimationFrame(show);
  return w;
}

function hfader(label, ch, ccNum) {
  const w = el('div', 'col'); w.style.width = '100%'; const f = el('div', 'hfader', '<div class="track"></div><div class="cap"></div>');
  let v = 64; const cap = f.querySelector('.cap');
  const show = () => { cap.style.left = (10 + (f.clientWidth - 20) * (v / 127)) + 'px'; };
  const set = nv => { nv = Math.max(0, Math.min(127, Math.round(nv))); if (nv !== v) { v = nv; show(); cc(ch, ccNum, v); } };
  const fromX = x => { const r = f.getBoundingClientRect(); return 127 * (x - r.left - 10) / (r.width - 20); };
  let dragging = false;
  f.addEventListener('pointerdown', e => { e.preventDefault(); dragging = true; f.setPointerCapture(e.pointerId); set(fromX(e.clientX)); });
  f.addEventListener('pointermove', e => { if (dragging) set(fromX(e.clientX)); });
  const end = () => { dragging = false; };
  f.addEventListener('pointerup', end); f.addEventListener('pointercancel', end);
  f.addEventListener('dblclick', () => set(64));
  w.append(f, el('div', 'lab', label));
  requestAnimationFrame(show); window.addEventListener('resize', show);
  return w;
}

// The VU meter Engine drives: CC 32/33 on the global channel, six segments
// at the ledCCValues of the assignment file, 0 14 27 40 53 66.
function vu(ccNum) {
  const v = el('div', 'vu'); for (let i = 0; i < 6; i++) v.append(el('i'));
  const steps = [0, 14, 27, 40, 53, 66];
  onLed(`c:${G}:${ccNum}`, val => { [...v.children].forEach((seg, i) => seg.classList.toggle('on', i > 0 && val >= steps[i])); });
  return v;
}

// The jog wheel: a 14-bit position that wraps, like an encoder, plus the touch
// note while a finger is on it. Engine takes the difference between successive
// positions, so direction and speed matter, not the absolute value.
function jog(d) {
  const j = el('div', 'jog', '<div class="mark"></div><div class="label"><b>' + d.name + '</b><span>JOG</span></div>');
  const mark = j.querySelector('.mark');
  let pos = 0, lastAngle = null, ang = 0, touched = false;
  const angleOf = e => { const r = j.getBoundingClientRect(); return Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2)); };
  const TICKS_PER_TURN = 16384 / 4;
  const move = da => { ang += da; mark.style.transform = `rotate(${ang * 180 / Math.PI}deg)`;
    pos = (pos + Math.round(da / (2 * Math.PI) * TICKS_PER_TURN) + 16384) % 16384; cc14(d.ch, C.jogMsb, C.jogLsb, pos); };
  j.addEventListener('pointerdown', e => { e.preventDefault(); touched = true; j.classList.add('touched'); lastAngle = angleOf(e);
    j.setPointerCapture(e.pointerId); noteOn(d.ch, N.jogTouch); });
  j.addEventListener('pointermove', e => { if (!touched) return; const a = angleOf(e); let da = a - lastAngle; lastAngle = a;
    if (da > Math.PI) da -= 2 * Math.PI; if (da < -Math.PI) da += 2 * Math.PI; move(da); });
  const end = () => { if (touched) { touched = false; j.classList.remove('touched'); noteOff(d.ch, N.jogTouch); } };
  j.addEventListener('pointerup', end); j.addEventListener('pointercancel', end);
  j.addEventListener('wheel', e => { e.preventDefault(); move(Math.sign(e.deltaY) * 2 * Math.PI / 60); }, { passive: false });
  const wrap = el('div', 'jogwrap'); wrap.append(j); return wrap;
}

// The browse encoder: relative CC, 1 = one step down, 127 = one step up; a click is the push note.
function encoder() {
  const e = el('div', 'encoder', '<div class="ptr"></div><div class="hint">BROWSE<br>drag · scroll<br>click = push</div>');
  const ptr = e.querySelector('.ptr'); let ang = 0, y0 = null, acc = 0, moved = false;
  const step = n => { for (let i = 0; i < Math.abs(n); i++) cc(G, C.browse, n > 0 ? 1 : 127); ang += n * 15; ptr.style.transform = `rotate(${ang}deg)`; };
  e.addEventListener('pointerdown', ev => { ev.preventDefault(); y0 = ev.clientY; acc = 0; moved = false; e.setPointerCapture(ev.pointerId); });
  e.addEventListener('pointermove', ev => { if (y0 == null) return; acc += (ev.clientY - y0); y0 = ev.clientY;
    const n = Math.trunc(acc / 14); if (n) { moved = true; acc -= n * 14; step(n); } });
  e.addEventListener('pointerup', () => { y0 = null; if (!moved) { e.classList.add('down'); noteOn(G, N.push);
    setTimeout(() => { e.classList.remove('down'); noteOff(G, N.push); }, 120); } });
  e.addEventListener('pointercancel', () => { y0 = null; });
  e.addEventListener('wheel', ev => { ev.preventDefault(); step(Math.sign(ev.deltaY)); }, { passive: false });
  return e;
}

// ---------------------------------------------------------------- layout
function buildDeck(side) {
  const d = DECK[side]; const root = document.getElementById(side === 'L' ? 'deckL' : 'deckR');
  const top = el('div', 'top');
  top.append(el('div', 'name', d.name + ' · ch ' + d.ch),
             button('VINYL', d.ch, N.vinyl, 'amber', 'note 35'),
             button('LOAD', G, d.load, 'red', 'ch 15 · note ' + d.load));
  const side_ = el('div', 'side');
  side_.append(button('−', d.ch, N.bendMinus, 'sq', 'bend'), button('+', d.ch, N.bendPlus, 'sq', 'bend'),
               vfader('PITCH', d.ch, C.speedMsb, C.speedLsb, { centre: true, cls: 'short' }));
  const pads = el('div', 'pads');
  const modeNames = ['HOT CUE', 'AUTO LOOP', 'FADER CUTS', 'ROLL'];
  N.modes.forEach((n, i) => pads.append(button(modeNames[i], d.ch, n, 'mode amber', 'note ' + n)));
  for (let i = 0; i < 4; i++) pads.append(button(String(i + 1), d.ch, N.pad0 + i, 'pad', 'note ' + (N.pad0 + i)));
  const tr = el('div', 'transport');
  tr.append(button('SHIFT', d.ch, N.shift, 'big', 'note 28'), button('SYNC', d.ch, N.sync, 'big blue', 'note 8'),
            button('CUE', d.ch, N.cue, 'big amber', 'note 9'), button('PLAY / PAUSE', d.ch, N.play, 'big green', 'note 10'));
  root.append(top, jog(d), side_, pads, tr);
}

function buildMixer() {
  const m = document.getElementById('mixer');
  const fx = el('div', 'fx'); FX.select.forEach((n, i) => fx.append(button(n, FX.ch, i, 'mode cyan', 'ch 4 · note ' + i)));
  const paddles = el('div', 'paddles');
  paddles.append(button('FX ON · CH 1', FX.ch, FX.paddle, 'red', 'paddle · ch 4 note 4'),
                 button('FX ON · CH 2', FX.paddleR, FX.paddle, 'red', 'paddle · ch 5 note 4'));
  const browse = el('div', 'row center'); browse.style.gap = '12px';
  const leftCol = el('div', 'col'); leftCol.append(button('BACK', G, N.back, 'mode', 'note 3'), button('VIEW', G, N.view, 'mode', 'note 16'));
  const rightCol = el('div', 'col'); rightCol.append(button('MENU', G, N.menu, 'mode', 'note 7'), button('S.SWITCH', G, N.soundswitch, 'mode', 'note 34'));
  browse.append(leftCol, encoder(), rightCol);
  const strips = el('div', 'row');
  ['L', 'R'].forEach((s, i) => {
    const ch = MIX[s]; const st = el('div', 'strip');
    const bottom = el('div', 'bottom');
    bottom.append(vu(C.vu[i]), vfader('LEVEL', ch, C.fader, null, { init: 100, cls: 'mixer' }));
    const knobs = el('div', 'knobs');
    knobs.append(knob('TRIM', ch, C.trim, { centre: true }), knob('HI', ch, C.hi, { centre: true }),
                 knob('MID', ch, C.mid, { centre: true }), knob('LOW', ch, C.low, { centre: true }),
                 knob('SWEEP FX', ch, C.sweep, { centre: true }), button('PFL', ch, N.pfl, 'mode green', 'note 13'));
    st.append(el('div', 'ch', 'CH ' + (i + 1) + ' · midi ' + ch), knobs, bottom);
    strips.append(st);
    if (i === 0) {
      const mid = el('div', 'mid');
      mid.append(knob('MASTER', G, C.master, { init: 90 }), knob('CUE MIX', G, C.cueMix, { centre: true }),
                 knob('CUE GAIN', G, C.cueGain, { init: 70 }), knob('SPEAKER', G, C.speaker, { init: 64 }));
      strips.append(mid);
    }
  });
  m.append(fx, paddles, el('div', 'sep'), browse, el('div', 'sep'), strips, hfader('CROSSFADER · ch 15 cc 14', G, C.xfader));
}

buildDeck('L'); buildMixer(); buildDeck('R');

// Keyboard: shift holds both SHIFT buttons, space plays deck 1, enter loads deck 1, arrows browse.
let shiftHeld = false;
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.key === 'Shift' && !shiftHeld) { shiftHeld = true; noteOn(DECK.L.ch, N.shift); noteOn(DECK.R.ch, N.shift); }
  if (e.code === 'Space') { e.preventDefault(); noteOn(DECK.L.ch, N.play); }
  if (e.key === 'Enter') noteOn(G, DECK.L.load);
  if (e.key === 'ArrowDown') { e.preventDefault(); cc(G, C.browse, 1); }
  if (e.key === 'ArrowUp') { e.preventDefault(); cc(G, C.browse, 127); }
});
window.addEventListener('keyup', e => {
  if (e.key === 'Shift') { shiftHeld = false; noteOff(DECK.L.ch, N.shift); noteOff(DECK.R.ch, N.shift); }
  if (e.code === 'Space') noteOff(DECK.L.ch, N.play);
  if (e.key === 'Enter') noteOff(G, DECK.L.load);
});
</script>
